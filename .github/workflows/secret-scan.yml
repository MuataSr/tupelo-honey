name: secret-scan

# Belt and braces: the local hooks can be bypassed with --no-verify, and they
# don't exist at all for someone who has never run scripts/install-hooks.sh.
# This runs on every push and pull request, and on a weekly schedule so a
# credential that predates the scanner still gets caught.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history: we scan every blob
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Scan current tree
        run: python3 scripts/secret_scan.py
      - name: Scan full history
        run: python3 scripts/secret_scan.py --all-history
